name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-validate:
    name: Build, Typecheck and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript (Strict Mode)
        run: npm run typecheck

      - name: Lint verification
        run: npm run lint

      - name: Production Build
        run: npm run build

      - name: Unit test execution
        run: npm test

  playwright-e2e:
    name: Playwright E2E Validation
    runs-on: ubuntu-latest
    needs: build-and-validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run E2E Test Suite Stub
        run: |
          if [ -d "tests/e2e" ]; then
            npm run test:e2e
          else
            echo "[playwright] tests/e2e directory will be populated in subsequent milestones."
          fi
