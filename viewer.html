<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Model &amp; Animation Viewer — Alice: Down the Rabbit-Hole</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a1613; color: #F7F3EA; font-family: Georgia, serif; overflow: hidden; }
    #viewer-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    #viewer-hud { position: absolute; left: 12px; top: 10px; font-size: 13px; line-height: 1.5; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
    #viewer-clips { position: absolute; right: 10px; top: 10px; max-height: 92vh; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
    #viewer-clips button { background: #2B2420; color: #F7F3EA; border: 1px solid #6b5848; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; text-align: left; }
    #viewer-clips button.active { background: #8a5a2b; }
  </style>
</head>
<body>
  <canvas id="viewer-canvas"></canvas>
  <div id="viewer-hud"></div>
  <div id="viewer-clips"></div>
  <script type="module" src="/src/viewer/main.ts"></script>
</body>
</html>
